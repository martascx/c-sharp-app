server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Requests starting with /api go to the backend container.
    # "api" is the service name in docker-compose.yml.
    location /api/ {
        proxy_pass http://api:8080;
    }

    # Everything else is the Angular app. Unknown paths return index.html
    # so Angular's router can handle them (e.g. refreshing /accounts/3).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

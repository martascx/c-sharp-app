services:
  # Database: SQL Server, reachable from your PC at localhost,1433 (SSMS / Azure Data Studio)
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-ButeoPassword123!}"
    ports:
      - "1433:1433"
    volumes:
      # Keeps the data when containers stop (docker compose down -v wipes it)
      - sqldata:/var/opt/mssql
    healthcheck:
      # Healthy once SQL Server answers a simple query
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-off job: creates and fills the Banco database from bdqueries.sql, then exits.
  # Skipped if the database already exists.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-ButeoPassword123!}"
    volumes:
      - ./bdqueries.sql:/scripts/bdqueries.sql:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        SQLCMD="/opt/mssql-tools18/bin/sqlcmd -S db -U sa -P $$MSSQL_SA_PASSWORD -C"
        EXISTS=$$($$SQLCMD -h -1 -W -Q "SET NOCOUNT ON; SELECT CASE WHEN DB_ID('Banco') IS NULL THEN 0 ELSE 1 END" | tr -d '[:space:]')
        if [ "$$EXISTS" = "1" ]; then
          echo "Database Banco already exists - skipping setup."
          exit 0
        fi
        echo "Creating database Banco from bdqueries.sql..."
        $$SQLCMD -b -f 65001 -i /scripts/bdqueries.sql > /dev/null && echo "Database ready."
    restart: "no"

  # Backend: C# API, reachable directly at http://localhost:5000
  api:
    build: ./Buteo.EdgeCollector.Api
    ports:
      - "5000:8080"
    environment:
      # Inside Docker the database is the "db" service, not localhost
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=Banco;User Id=sa;Password=${SA_PASSWORD:-ButeoPassword123!};TrustServerCertificate=True;"
    depends_on:
      db-init:
        condition: service_completed_successfully

  # Frontend: Angular served by nginx at http://localhost:8080
  frontend:
    build: ./Buteo_ui
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  sqldata:
